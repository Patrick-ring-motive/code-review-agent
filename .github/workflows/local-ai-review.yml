name: Local AI Code Review

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Repository owner to scan (blank uses this repository owner)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: local-ai-main-scan
  cancel-in-progress: false

env:
  REVIEW_OWNER: ${{ inputs.owner || github.repository_owner }}

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      repositories: ${{ steps.discover.outputs.repositories }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover accessible owned repositories
        id: discover
        env:
          REVIEW_TOKEN: ${{ secrets.REPO_REVIEW_TOKEN }}
        run: node .github/scripts/review-repositories.mjs discover

  review:
    needs: discover
    if: needs.discover.outputs.repositories != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MODEL: SandLogicTechnologies/Qwen3.5-4B-GGUF:Q4_K_M
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install llama.cpp
        shell: bash
        run: |
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start local model server
        shell: bash
        env:
          MODEL: "SandLogicTechnologies/Qwen3.5-4B-GGUF:Q4_K_M"
        run: |
          mkdir -p "$RUNNER_TEMP/hf"
          export HF_HOME="$RUNNER_TEMP/hf"

          nohup llama serve \
            -hf "$MODEL" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 8192 \
            --threads 4 \
            --parallel 1 \
            > "$RUNNER_TEMP/llama.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/llama.pid"

          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/v1/models >/dev/null; then
              echo "llama.cpp is ready"
              exit 0
            fi
            sleep 2
          done

          echo "llama.cpp failed to start"
          cat "$RUNNER_TEMP/llama.log"
          exit 1

      - name: Review main and publish suggestions
        env:
          REVIEW_TOKEN: ${{ secrets.REPO_REVIEW_TOKEN }}
          REVIEW_REPOSITORIES: ${{ toJSON(matrix.repository) }}
        run: node .github/scripts/review-repositories.mjs review-batch

      - name: Dump local model log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/llama.log" ]; then
            cat "$RUNNER_TEMP/llama.log"
          fi
